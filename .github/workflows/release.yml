name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitPython 3.1.60 (2026-08-25) removed Actor.name_email_regex, which
      # python-semantic-release's config loader calls directly - breaks every
      # invocation, including inside the official Docker action (it installs
      # gitpython~=3.0 unpinned at image-build time, so it now resolves 3.1.60
      # too). Upstream bug, unfixed as of v9.21.2:
      # https://github.com/python-semantic-release/python-semantic-release/issues/1475
      # Run the CLI directly instead of the Docker action so this pin actually
      # takes effect; remove the pin once that issue is closed.
      - name: Install python-semantic-release
        run: pip install "python-semantic-release==9.21.2" "gitpython<3.1.60"

      - name: Configure git identity for the release commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v version --commit --tag --push --changelog --vcs-release

  build-binaries:
    name: Build portable ${{ matrix.asset_name }}
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built_name: Jarvis.exe
            asset_name: Jarvis-windows.exe
          - os: macos-latest
            built_name: Jarvis
            asset_name: Jarvis-macos
          - os: ubuntu-latest
            built_name: Jarvis
            asset_name: Jarvis-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable executable
        run: pyinstaller build/jarvis.spec --distpath dist --workpath build/work --noconfirm

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.built_name }}" "dist/${{ matrix.asset_name }}"

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/${{ matrix.asset_name }}
