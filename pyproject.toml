[project]
name = "jarvis-gesture-hud"
version = "0.1.0"
description = "Webcam hand-gesture desktop controller with offline Jarvis voice feedback, native translucent overlays, and local voice+LLM command understanding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.semantic_release]
version_variables = ["src/jarvis/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = ""
upload_to_pypi = false
upload_to_release = false
commit_message = "chore(release): {version}"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
major_on_zero = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "build", "ci", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
